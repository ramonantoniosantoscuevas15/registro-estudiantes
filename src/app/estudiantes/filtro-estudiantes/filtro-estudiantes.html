<form [formGroup]="form">
  <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
    <div class="sm:col-span-3">
            <label for="first-name" class="block text-sm/6 font-medium text-white">Nombre del Estudiante </label>
            <div class="mt-2">
              <input id="first-name" type="text" name="first-name" autocomplete="given-name"
                class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
                [formControl]="form.controls.nombre"/>

            </div>
          </div>



  </div>
  <div class="sm:col-span-3">
          <label for="country" class="block text-sm/6 font-medium text-white">Curso</label>
          <div class="mt-2 grid grid-cols-1">
            <select [formControl]="form.controls.cursoid" class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white/5 py-1.5 pr-8 pl-3 text-base text-white outline-1 -outline-offset-1 outline-white/10 *:bg-gray-800 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6">
              <option [value]="0">Seleccione un Curso</option>
              @for (curso of cursos; track $index) {
                <option [value]="curso.id">{{curso.curso}}</option>
              }

            </select>
            <svg viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-400 sm:size-4">
              <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
            </svg>
          </div>
        </div>
        
</form>

<app-listado-estudiantes [estudiantes]="estudiantes"></app-listado-estudiantes>
