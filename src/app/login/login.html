<form autocomplete="off" [formGroup]="form">
  <div class="hero bg-base-200 min-h-screen">
  <div class="hero-content flex-col lg:flex-row-reverse">
    <div class="text-center lg:text-left">

    </div>
    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label">Usuario</label>
          <input type="text" class="input" [formControl]="form.controls.usuario"  placeholder="Usuario" />
          @if(formutilidades.isvalidField(form,'usuario')){
            <span>{{formutilidades.getFieldError(form,"usuario")}}</span>
          }
          <label class="label">Contraseña</label>
          <input type="password" class="input ng-untouched ng-pristine ng-valid" [formControl]="form.controls.password" placeholder="Contraseña" />
           @if(formutilidades.isvalidField(form,'password')){
            <span>{{formutilidades.getFieldError(form,"password")}}</span>
          }
          <button routerLink="/estudiantes" class="btn btn-neutral mt-4" [disabled]="form.invalid">Ingresar</button>
        </fieldset>
      </div>
    </div>
  </div>
</div>

</form>
