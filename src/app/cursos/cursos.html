<div class="p-5 xl:ml-90">
<form (submit)="guadarCurso()" [formGroup]="form">
  <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
    <div class="sm:col-span-3">
            <label for="first-name" class="block text-sm/6 font-medium text-white">Nombre del Curso </label>
            <div class="mt-2">
              <input id="first-name" type="text" name="first-name" autocomplete="given-name"
                class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
                [formControl]="form.controls.nombreCurso"/>
                @if(formutilidades.isvalidField(form,'nombreCurso')){
            <mat-error>{{formutilidades.getFieldError(form,"nombreCurso")}}</mat-error>
          }
            </div>
          </div>


  </div>



  <div class="mt-6 flex items-center justify-center gap-x-6">
    <button  class="btn rounded-md bg-indigo-500 px-3 py-2" [disabled]="form.invalid">Ingresar Curso</button>
    <!-- <button type="submit"
      class="rounded-md bg-indigo-500 px-3 py-2 text-sm font-semibold text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500" [disabled]="form.invalid">Agregar Estudiante</button> -->
    <button type="reset" class="btn font-semibold text-white">Cancelar</button>

  </div>

</form>
</div>
