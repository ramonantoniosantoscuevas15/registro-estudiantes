<div class="p-5 xl:ml-90">
  <app-listado [listado]="cursos">
    <ng-container contenido>
      <table mat-table [dataSource]="cursos" class="mat-elevation-z8 indice-elementos">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Id</th>
          <td mat-cell *matCellDef="let elemento">{{elemento.id}}</td>
        </ng-container>
        <ng-container matColumnDef="nombreCurso">
          <th mat-header-cell *matHeaderCellDef>Curso</th>
          <td mat-cell *matCellDef="let elemento">{{elemento.nombreCurso}}</td>
        </ng-container>
        <ng-container matColumnDef="Acciones">
          <th mat-header-cell *matHeaderCellDef> Acciones</th>
          <td mat-cell *matCellDef="let elemento">
            <a routerLink="/curso/editar/{{elemento.id}}" button mat-flat-button class="primary"> Editar</a>
            <button mat-flat-button class="boton-rojo" [swal]="{title:'Confirmacion', text:'Quieres Borrar este registro',
          showCancelButton:true}" (confirm)="borrar(elemento.id)" >Borrar</button>
          </td>


        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnasAMostrar"></tr>
        <tr mat-row *matRowDef="let row; columns:columnasAMostrar"></tr>
      </table>
      <mat-paginator showFirstLastButtons [length]="cantidadTotalRegistros"
      [pageIndex]="paginacion.pagina-1"
      [pageSize]="paginacion.recordsPorPagina"
      [pageSizeOptions]="[5, 10, 50]" class="mat-elevation-z8"(page)="actualizarPaginacion($event)"
      >

      </mat-paginator>
    </ng-container>

  </app-listado>
</div>
